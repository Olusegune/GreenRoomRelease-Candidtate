name: Release

# Push a tag such as v0.5.1 to build the Windows installers and attach them to a GitHub Release.
# Optional repository secrets: TAURI_SIGNING_PRIVATE_KEY (+ TAURI_SIGNING_PRIVATE_KEY_PASSWORD) for signed in-app updates.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: app/src-tauri
      - name: Install, typecheck, test
        working-directory: app
        run: |
          npm ci
          npx tsc --noEmit
          npx vitest run
      - name: Rust checks
        working-directory: app/src-tauri
        run: |
          cargo clippy --all-targets -- -D warnings
          cargo test
      - name: Build installers
        working-directory: app
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          if [ -z "$TAURI_SIGNING_PRIVATE_KEY" ]; then
            npx tauri build --bundles nsis,msi --config '{"bundle":{"createUpdaterArtifacts":false}}'
          else
            npx tauri build --bundles nsis,msi
          fi
      - name: Portable zip and checksums
        shell: pwsh
        run: |
          $rel = "app/src-tauri/target/release"
          New-Item -ItemType Directory -Force out | Out-Null
          Copy-Item "$rel/bundle/nsis/*.exe" out
          Copy-Item "$rel/bundle/msi/*.msi" out
          Copy-Item "$rel/greenroom-local.exe" "out/Greenroom Local.exe"
          Compress-Archive -Path "out/Greenroom Local.exe" -DestinationPath "out/Greenroom-Local-portable.zip"
          Remove-Item "out/Greenroom Local.exe"
          Get-ChildItem out -File | ForEach-Object { "$((Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower())  $($_.Name)" } | Set-Content out/SHA256SUMS.txt
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" out/* --title "Greenroom Local ${{ github.ref_name }}" --generate-notes
      - uses: actions/upload-artifact@v4
        with:
          name: windows-installers
          path: out/*
